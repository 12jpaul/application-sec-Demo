[pytest]
# Use the in-memory SQLite test settings so CI needs no MySQL (see test.py)
DJANGO_SETTINGS_MODULE = config.settings.test

# Discover tests under backend/tests/
testpaths = tests

# Treat warnings as errors to catch deprecations early
filterwarnings =
    error
    ignore::DeprecationWarning:django.*
    ignore::DeprecationWarning:channels.*
    ignore::PendingDeprecationWarning
