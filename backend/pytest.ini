[pytest]
# Use the in-memory SQLite test settings so CI needs no MySQL (see test.py)
DJANGO_SETTINGS_MODULE = config.settings.test

# Discover tests under backend/tests/
testpaths = tests

# Short tracebacks make CI output easier to read when a test fails
addopts = --tb=short

# Warning policy:
#   - Warnings from OUR application code → errors (we must fix them)
#   - Warnings from third-party packages → ignored
# This approach is more robust than maintaining an ever-growing ignore list;
# new transitive deps on Python 3.12 (Linux) won't break CI.
filterwarnings =
    ignore
    error::DeprecationWarning:accounts.*
    error::DeprecationWarning:audit.*
    error::DeprecationWarning:listings.*
    error::DeprecationWarning:messaging.*
    error::DeprecationWarning:orders.*
    error::DeprecationWarning:moderation.*
    error::DeprecationWarning:integrations.*
    error::DeprecationWarning:config.*
