[pytest]
# Use the in-memory SQLite test settings so CI needs no MySQL (see test.py)
DJANGO_SETTINGS_MODULE = config.settings.test

# Discover tests under backend/tests/
testpaths = tests

# Short tracebacks make CI output easier to read when a test fails
addopts = --tb=short

# Treat warnings as errors to catch deprecations early.
# Third-party packages that use deprecated asyncio/twisted APIs on Python 3.12
# (Linux) are excluded to avoid false CI failures from their internal housekeeping.
# Our own code (accounts.*, audit.*, etc.) is NOT excluded and will still fail on
# any DeprecationWarning we introduce.
filterwarnings =
    error
    ignore::DeprecationWarning:django.*
    ignore::DeprecationWarning:channels.*
    ignore::DeprecationWarning:daphne.*
    ignore::DeprecationWarning:twisted.*
    ignore::DeprecationWarning:autobahn.*
    ignore::DeprecationWarning:txaio.*
    ignore::DeprecationWarning:asyncio.*
    ignore::DeprecationWarning:uvicorn.*
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning:asyncio.*
