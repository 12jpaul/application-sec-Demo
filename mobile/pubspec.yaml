name: sokolink
description: SokoLink – Secure Local Online Marketplace (CIS 4163 Application Security Technologies)
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# ---------------------------------------------------------------------------
# API base URL is supplied at build time via --dart-define=API_BASE_URL=...
# No secrets or API keys are stored in the app (Security rule 10 / T16).
# Example:
#   flutter run --dart-define=API_BASE_URL=https://api.sokolink.rw
# ---------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: 5.8.0+1                      # HTTP client with interceptors

  # State management
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1

  # Navigation
  go_router: 14.8.1

  # Secure storage – tokens stored here only, never SharedPreferences (T15)
  flutter_secure_storage: 9.2.4

  # Encrypted local cache (SQLCipher) – key stored in secure storage (T15)
  sqflite_sqlcipher: 3.4.1

  # Real-time chat (Phase 5)
  web_socket_channel: 3.0.3

  # Utilities
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 5.0.0
  riverpod_generator: 2.6.5
  build_runner: 2.4.15

flutter:
  uses-material-design: true
  # Assets and fonts added per phase as screens are built.
